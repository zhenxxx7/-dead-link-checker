name: Check — commercial.yoha

on:
  schedule:
    # 06:20, 13:20, and 19:20 Singapore time / WITA (UTC+8).
    # Staggered 10m apart from the other workflows because all 4 sites share the same origin servers.
    - cron: '20 22 * * *'
    - cron: '20 5 * * *'
    - cron: '20 11 * * *'
  workflow_dispatch:

concurrency:
  group: check-commercial-yoha
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/_site_check.yml
    with:
      site_name: commercial.yoha
      target: https://www.commercial.yoha.com.sg/
      sheet_name: commercial.yoha
      min_checked: 200
      max_timeout_rows: 10
      scan_attempts: 3
      dead_link_retries: 4
      dead_link_retry_delay_seconds: 300
    secrets:
      SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
