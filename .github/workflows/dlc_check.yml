name: Scheduled Dead Link Checker

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Packages
        run: pip install -r requirements.txt

      - name: Run Script
        env:
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          TARGET_URL: https://www.emservices.com.sg/
          PYTHONUNBUFFERED: '1'
        run: python dlc_sheets.py

      - name: Upload Scan Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-report
          path: |
            scan_report.csv
            scan_status.json
          if-no-files-found: ignore
