name: Reusable Single Site Check

on:
  workflow_call:
    inputs:
      site_name:
        required: true
        type: string
      target:
        required: true
        type: string
      sheet_name:
        required: true
        type: string
      min_checked:
        required: true
        type: number
      max_timeout_rows:
        required: false
        type: number
        default: 10
      scan_attempts:
        required: false
        type: number
        default: 3
      dead_link_retries:
        required: false
        type: number
        default: 4
      dead_link_retry_delay_seconds:
        required: false
        type: number
        default: 300
    secrets:
      SHEET_WEBHOOK_URL:
        required: false

permissions:
  contents: read

jobs:
  site-check:
    name: Site Check (${{ inputs.site_name }})
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install Python packages and Chromium
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run Dead Link Checker Site Check (${{ inputs.site_name }})
        env:
          PYTHONUNBUFFERED: '1'
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
        run: >-
          python provider_site_check.py
          --target "${{ inputs.target }}"
          --sheet-name "${{ inputs.sheet_name }}"
          --output-dir "reports/${{ inputs.site_name }}"
          --scan-attempts "${{ inputs.scan_attempts }}"
          --dead-link-retries "${{ inputs.dead_link_retries }}"
          --dead-link-retry-delay-seconds "${{ inputs.dead_link_retry_delay_seconds }}"
          --min-checked "${{ inputs.min_checked }}"
          --max-timeout-rows "${{ inputs.max_timeout_rows }}"
          --ocr-captcha

      - name: Build Excel report (${{ inputs.site_name }})
        if: always()
        run: >-
          python build_excel_report.py
          --sites sites.json
          --site "${{ inputs.site_name }}"
          --reports-dir "reports/${{ inputs.site_name }}"
          --output "reports/${{ inputs.site_name }}/dead-link-report-${{ inputs.site_name }}-${{ github.run_id }}.xlsx"

      - name: Upload provider report and Excel (${{ inputs.site_name }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: provider-site-check-${{ inputs.site_name }}-${{ github.run_id }}
          path: reports/${{ inputs.site_name }}/
          if-no-files-found: warn
