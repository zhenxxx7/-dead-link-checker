name: Provider Site Check

on:
  schedule:
    # 06:00, 13:00, and 19:00 Singapore time / WITA (UTC+8).
    - cron: '0 22 * * *' # 06:00 on the following day
    - cron: '0 5 * * *'  # 13:00 on the same day
    - cron: '0 11 * * *' # 19:00 on the same day
  workflow_dispatch:
    inputs:
      site:
        description: 'Website to check (all runs every website sequentially)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - emservices
          - commercial.yoha
          - emengineering
          - emre

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.load-sites.outputs.matrix }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Load target sites
        id: load-sites
        env:
          SELECTED_SITE: ${{ github.event.inputs.site || 'all' }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib

          sites = json.loads(pathlib.Path("sites.json").read_text(encoding="utf-8"))
          selected = os.environ.get("SELECTED_SITE", "all").strip()
          if selected and selected != "all":
              sites = [s for s in sites if s["name"] == selected]
          if not sites:
              raise SystemExit(f"Unknown site selection: {selected!r}")
          matrix = json.dumps({"include": sites}, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"matrix={matrix}\n")
          PY

  site-check:
    name: Site Check (${{ matrix.name }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # All four websites share the same origin servers; run sequentially to avoid timeouts.
      max-parallel: 1
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install Python packages and Chromium
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run Dead Link Checker Site Check (${{ matrix.name }})
        env:
          PYTHONUNBUFFERED: '1'
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
        run: >-
          python provider_site_check.py
          --target "${{ matrix.target }}"
          --sheet-name "${{ matrix.sheet }}"
          --output-dir "reports/${{ matrix.name }}"
          --scan-attempts 3
          --dead-link-retries 4
          --dead-link-retry-delay-seconds 300
          --min-checked "${{ matrix.min_checked }}"
          --max-timeout-rows "${{ matrix.max_timeout_rows }}"
          --ocr-captcha

      - name: Upload provider report and diagnostics (${{ matrix.name }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: provider-site-check-${{ matrix.name }}-${{ github.run_id }}
          path: reports/${{ matrix.name }}/
          if-no-files-found: warn

  excel-report:
    name: Build Combined Excel Report
    needs: [prepare, site-check]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install openpyxl
        run: python -m pip install "openpyxl>=3.1,<4"

      - name: Download per-site artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: provider-site-check-*-${{ github.run_id }}
          path: downloaded-reports

      - name: Generate multi-sheet Excel report
        run: >-
          python build_excel_report.py
          --sites sites.json
          --reports-dir downloaded-reports
          --output "dead-link-report-${{ github.run_id }}.xlsx"

      - name: Upload combined Excel report
        uses: actions/upload-artifact@v7
        with:
          name: dead-link-excel-report-${{ github.run_id }}
          path: dead-link-report-${{ github.run_id }}.xlsx
          if-no-files-found: warn
